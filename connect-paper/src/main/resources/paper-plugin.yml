name: BlysisConnect
version: '${version}'
main: com.uxplima.blysis.paper.bootstrap.ConnectPlugin
api-version: '26.2'
authors: ['INOVIXI']
description: 'Connects this server to its Blysis site: deliveries, the store, credits and linking.'
website: 'https://github.com/INOVIXI/blysis-connect-minecraft'

# Every scheduler call goes through the uxmLib Scheduler port, which routes to the
# right global, region, entity or async scheduler. Nothing calls BukkitScheduler.
folia-supported: true

# Optional integrations. The plugin runs fully without any of them, because every
# third-party symbol is reached only past a plugin-present guard.
dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
    # A skill level an announcement line may name. Read only when it is there.
    mcmmo:
      load: BEFORE
      required: false
    # Bedrock players get native forms when these are present. Looked up by name, never required.
    floodgate:
      load: BEFORE
      required: false
    Geyser-Spigot:
      load: BEFORE
      required: false

permissions:
  # What a player has by default.
  blysis.language:
    description: Choose the language you read this plugin in
    default: true
  blysis.credits:
    description: Read your credits on the site
    default: true
  blysis.credits.send:
    description: Send credits to another member
    default: true
  blysis.credits.top:
    description: Read the credit rankings
    default: true
  blysis.store:
    description: Open the store and buy with credits
    default: true
  blysis.chest:
    description: Take what you bought, accept gifts and take back the ones you sent
    default: true
  blysis.link:
    description: Link this account to the site
    default: true
  blysis.voucher.create:
    description: Turn your own credits into a voucher
    default: true
  blysis.voucher.redeem:
    description: Redeem a voucher
    default: true

  # What an operator does. Off unless the server grants it, and admin.* grants the family
  # in one line.
  blysis.admin.*:
    description: Everything an operator does with this plugin
    default: op
  blysis.admin.doctor:
    description: Ask how this plugin is
    default: op
  blysis.admin.version:
    description: Read the version this server runs
    default: op
  blysis.admin.credits:
    description: Add, remove, set and read another member's credits, where the site allows it
    default: op
  blysis.admin.voucher:
    description: Mint a voucher nobody paid for, where the site allows it
    default: op
  blysis.admin.notify:
    description: Read once that the site stopped answering, and once that it is back
    default: op
  blysis.admin.reload:
    description: Read the configuration again
    default: op
  blysis.admin.language:
    description: Set or clear the language another player reads
    default: op
