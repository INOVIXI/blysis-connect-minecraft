# English messages.
#
# Every line is MiniMessage, and every line names a role instead of a colour: <body> is the
# text, <value> is a name or a number, <tag:'BLYSIS'> is the prefix a chat line opens with.
# The colours behind those names live in theme.conf.
#
# Write ordinary words here. The plugin converts English into small capitals when it renders
# the line, so this file stays readable for a translator.
#
# A key that is missing here falls back to the default that the code carries, so the plugin
# can never show an empty message. Delete a line to take the default back.

admin {
  version       = "<tag:'BLYSIS'> <body>BlysisConnect <value><version>"
  reloaded      = "<tag:'BLYSIS'> <body>The configuration is loaded again, in <value><ms><body> ms."
  reload-failed = "<etag:'ERROR'> <body>The reload failed. The console holds the reason."
  status = "<tag:'BLYSIS'> <body>The site: <value><state><body>. Outcomes waiting for it: <value><waiting><body>."
  usage  = "<tag:'BLYSIS'> <body>Use <value>reload<body>, <value>status<body> or <value>version<body>."
}

# What a player reads about their account on the site. <balance> and <amount> are credits.
account {
  not-connected  = "<etag:'ERROR'> <body>This server is not connected to the site yet."
  away           = "<etag:'ERROR'> <body>The site does not answer right now. Nothing was taken; try again in a moment."
  silent         = "<etag:'ERROR'> <body>The site does not answer right now. Try again in a moment."
  unsure         = "<etag:'ERROR'> <body>The site did not confirm in time. Look at your balance before you try again."
  player-unknown = "<etag:'ERROR'> <body>Nobody called <value><input><body> is online."
}

# The site's refusals, one line per code it can answer. A code this file does not name reads
# refused.other, with the code in <code>.
refused {
  other                   = "<etag:'ERROR'> <body>The site refused that: <value><code><body>."
  not_linked              = "<etag:'ERROR'> <body>Link your account first: <value>/link<body>, or make a code on the site and type it after <value>/verify<body>."
  recipient_unknown       = "<etag:'ERROR'> <body>Nobody on the site answers to that name, or it could mean two people."
  insufficient_balance    = "<etag:'ERROR'> <body>You do not have enough credits for that."
  amount_invalid          = "<etag:'ERROR'> <body>That is not an amount: more than zero, at most 99999999, two decimals at most."
  same_account            = "<etag:'ERROR'> <body>That is your own account."
  not_allowed             = "<etag:'ERROR'> <body>The site does not let this server do that. An admin can allow it."
  not_found               = "<etag:'ERROR'> <body>The site has no such thing any more."
  not_in_game             = "<etag:'ERROR'> <body>That is not for sale in game."
  out_of_stock            = "<etag:'ERROR'> <body>That has sold out."
  quantity_invalid        = "<etag:'ERROR'> <body>You cannot buy that many of it."
  limit_reached           = "<etag:'ERROR'> <body>One account may own only so many of that, and whoever it is for has reached it."
  field_invalid           = "<etag:'ERROR'> <body>The answer to <value><field><body> is missing or wrong."
  not_giftable            = "<etag:'ERROR'> <body>That cannot be given to someone else."
  recipient_refuses_gifts = "<etag:'ERROR'> <body>That member does not take gifts."
  already_claimed         = "<etag:'ERROR'> <body>That was already claimed."
  not_pending             = "<etag:'ERROR'> <body>That gift is no longer waiting."
  voucher_used            = "<etag:'ERROR'> <body>That voucher was already redeemed. It is worth nothing now."
  code_invalid            = "<etag:'ERROR'> <body>That code is wrong, used or expired. Make a new one."
  rate_limited            = "<etag:'ERROR'> <body>That was tried too often. Wait a few minutes, then try again."
  already_linked          = "<etag:'ERROR'> <body>This account or that member is already linked. Unlink it on the site first."
  needs_player_name       = "<etag:'ERROR'> <body>That item needs a player name. Claim it from the site's chest."
  unavailable             = "<etag:'ERROR'> <body>That cannot be bought by this account right now. The store page on the site says why."
}

credits {
  usage         = "<tag:'BLYSIS'> <body>Use <value>/credits<body>, <value>/credits send <member> <amount><body> or <value>/credits top [balance|topups|latest] [day|month|year|all]<body>."
  balance       = "<tag:'BLYSIS'> <body>You have <value><balance><body> credits."
  balance-remembered = "<tag:'BLYSIS'> <body>You had <value><balance><body> credits when the site last answered. It does not answer now, so this may have changed."
  sent          = "<tag:'BLYSIS'> <body>You sent <value><amount><body> credits to <value><to><body>. You have <value><balance><body> left."
  top-header    = "<h:'Top credits'>"
  top-line      = "<rank>#<place> <body><name> <subtext><amount>"
  top-anonymous = "<subtext>a member"
  top-empty     = "<tag:'BLYSIS'> <body>Nobody is on this list yet."
  admin-done    = "<tag:'BLYSIS'> <value><target><body> has <value><balance><body> credits."
}

# <link> is the site's page, and a click opens it.
link {
  code    = "<tag:'BLYSIS'> <body>Open <value><link><body> signed in and confirm <value><code><body>. It lasts ten minutes."
  done    = "<tag:'BLYSIS'> <body>This account is linked to <value><member><body> on the site."
  already = "<tag:'BLYSIS'> <body>This account is already linked to <value><member><body>."
}

command {
  no-permission        = "<etag:'ERROR'> <body>You do not have permission to do that."
  player-only        = "<etag:'ERROR'> <body>Only a player can run this command."
}
