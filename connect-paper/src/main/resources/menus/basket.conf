# The purchase window: how many, for whom, and the tile that sums it up and buys.
#
# The header of menus/store.conf explains the grammar. The actions this window knows:
#   blysis:more:<n>    adds n to how many
#   blysis:less:<n>    takes n off
#   blysis:amount      asks for how many as typed text, in the mode text-input.conf gives "quantity"
#   blysis:recipient   opens the window of players online, to choose who it is for
#   blysis:self        makes it for the buyer again
#   blysis:confirm     asks the questions the product has, then buys
#   blysis:back        back to the shelf
#   blysis:describe    says the whole of the product's description in chat
#
# The facts these tiles may name: price, servers, stock, quantity, most, total, recipient,
# balance (the credits now), after (the credits after the purchase).

title = "@menu.basket.title"
rows = 5
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {

  bar {
    slots = ["36-44"]
    priority = 1
    material = GRAY_STAINED_GLASS_PANE
    name = " "
  }

  product {
    slot = 4
    priority = 5
    material = "%product_item%"
    name = " "
    lore = ["tile:3 @menu.basket.product price servers stock"]
    click { left = ["blysis:describe", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
  }

  less-10 {
    slot = 19
    priority = 5
    material = RED_STAINED_GLASS_PANE
    name = "@menu.button.minus-10"
    click { left = ["blysis:less:10", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
  }

  less-1 {
    slot = 20
    priority = 5
    material = RED_STAINED_GLASS_PANE
    name = "@menu.button.minus-1"
    click { left = ["blysis:less:1", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
  }

  quantity {
    slot = 22
    priority = 5
    material = HOPPER
    name = " "
    lore = ["tile:5 @menu.basket.quantity quantity most"]
    click { left = ["blysis:amount", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
  }

  more-1 {
    slot = 24
    priority = 5
    material = LIME_STAINED_GLASS_PANE
    name = "@menu.button.plus-1"
    click { left = ["blysis:more:1", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
  }

  more-10 {
    slot = 25
    priority = 5
    material = LIME_STAINED_GLASS_PANE
    name = "@menu.button.plus-10"
    click { left = ["blysis:more:10", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
  }

  recipient {
    slot = 29
    priority = 5
    material = PLAYER_HEAD
    name = " "
    lore = ["tile:4 @menu.basket.recipient recipient"]
    click {
      left  = ["blysis:recipient", "sound:UI_BUTTON_CLICK 0.5 1.6"]
      right = ["blysis:self", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  confirm {
    slot = 33
    priority = 5
    material = EMERALD
    name = " "
    lore = ["tile:money @menu.basket.confirm recipient quantity price total balance after"]
    click { left = ["blysis:confirm", "sound:BLOCK_NOTE_BLOCK_PLING 0.6 1.5"] }
  }

  back {
    slot = 36
    priority = 10
    material = FEATHER
    name = "@menu.button.back"
    click { left = ["blysis:back", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
  }
}
