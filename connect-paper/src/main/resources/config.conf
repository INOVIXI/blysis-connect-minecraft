# BlysisConnect configuration.
#
# Every value here is read on enable and on /blysis reload. The plugin swaps in
# the new file as one snapshot, so a reload is never half applied.
#
# When a release adds a key, the next start adds it here with the comment that explains it, and
# it never changes a value you wrote. The file as it was is kept beside this one as
# config.conf.bak. What the merge cannot keep is your own formatting: the file is written again
# from what it holds, so alignment inside a block may move. A key you deleted on purpose comes
# back, which is why every switch says here what turning it off means.

# The language a player reads.
#
# The languages this plugin has are the files in messages/. Write one more file and the
# language exists: nothing here lists them, so nothing has to be rebuilt.
language {
  # What a player reads when nothing else answers, and the fallback for a key that a
  # translation has not reached yet.
  default = "en"

  # Whether a player who has chosen nothing reads the language their client is set to.
  # Turn this off to start every player in the default language and let them choose.
  follow-client = true

  # One language for everybody, whatever they chose and whatever their client says.
  # Leave it empty for none. A server with one audience writes its tag here.
  force = ""
}

# The Blysis site this server belongs to.
site {
  # The site's address, as a player opens it, such as "https://example.com". The plugin calls
  # it; nothing calls this server, and no port is opened here.
  address = ""

  # This server's token. An admin makes it on the site under Game Connect, Servers, and the site
  # shows it once. It is this server's whole identity there: keep it out of screenshots and
  # out of any file you share. Empty means the plugin starts and connects to nothing.
  token = ""
}

# What the site may run on this server's console.
delivery {
  # Commands the site is never allowed to run, whatever it sends. A word is matched without its
  # slash and its namespace, under every alias the server knows, and inside execute ... run.
  # Removing one is allowed and means the site may run it again. A blocklist can only name what
  # it knows: anyone who takes over the site's admin can queue every command not listed here.
  blocked = ["op", "deop", "stop", "restart", "reload", "whitelist", "ban-ip", "pardon-ip", "sudo", "runas", "function", "schedule", "datapack", "plugman", "plugmanx", "pluginmanager"]

  # The strict form, and the safer one: when this list is not empty, the site may run only these
  # commands and nothing else, such as ["lp", "give", "eco"]. A namespaced entry such as
  # "luckperms:lp" allows that spelling only.
  allow-only = []

  # How long one command may take on the console before it counts as failed.
  command-timeout-seconds = 10
}

# How patiently this server calls the site.
connection {
  # How long to wait for the site to accept a connection.
  connect-timeout-seconds = 5

  # How long to wait for an answer to an ordinary call. The long-poll waits as long as the site
  # holds it, plus ten seconds, whatever this says.
  request-timeout-seconds = 15

  # The first wait after the site did not answer. Each failure doubles it, up to the longest.
  retry-first-seconds = 2
  retry-longest-seconds = 120
}

# The item a voucher travels as. It carries only the voucher's id, so its look is yours to pick.
voucher {
  # A material name, such as PAPER or NAME_TAG. A name the server does not know reads as PAPER.
  material = "PAPER"
}

# The item a store tile is drawn on when the site gives none, or gives one this server does not
# know. The site's own icon always wins when it names an item.
icons {
  shelf   = "CHEST"
  product = "PAPER"
}
