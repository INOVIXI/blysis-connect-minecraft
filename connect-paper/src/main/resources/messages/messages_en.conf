# English messages.
#
# Every line is MiniMessage, and every line names a role instead of a colour: <body> is the
# text, <value> is a name or a number, <tag:'BLYSIS'> is the prefix a chat line opens with.
# The colours behind those names live in theme.conf.
#
# Write ordinary words here. The plugin converts English into small capitals when it renders
# the line, so this file stays readable for a translator.
#
# A key that is missing here falls back to the default that the code carries, so the plugin
# can never show an empty message. Delete a line to take the default back.

admin {
  version       = "<tag:'BLYSIS'> <body>BlysisConnect <value><version>"
  usage         = "<tag:'BLYSIS'> <body>Add <value>help<body> after this command to see everything it does."
  reloaded      = "<tag:'BLYSIS'> <body>The configuration is loaded again, in <value><ms><body> ms."
  reload-failed = "<etag:'ERROR'> <body>The reload failed. The console holds the reason."

  doctor {
    header = "<h:'How this plugin is'>"
    ok     = "<good>ok<body>  <value><check><body>: <subtext><said>"
    warn   = "<warn>warn<body>  <value><check><body>: <subtext><said>"
    fail   = "<bad>fail<body>  <value><check><body>: <subtext><said>"
    well   = "<tag:'BLYSIS'> <body>Everything answered."
    unwell = "<etag:'ERROR'> <body>Something is wrong above. The console carries the whole of it."
  }
}

# What a player reads about their account on the site. <balance> and <amount> are credits.
account {
  not-connected  = "<etag:'ERROR'> <body>This server is not connected to the site yet."
  away           = "<etag:'ERROR'> <body>The site does not answer right now. Nothing was taken; try again in a moment."
  unsure         = "<etag:'ERROR'> <body>The site did not confirm in time. Look at your balance before you try again."
  player-unknown = "<etag:'ERROR'> <body>Nobody called <value><input><body> is online."
}

# The site's refusals, one line per code it can answer. A code this file does not name reads
# refused.other, with the code in <code>.
refused {
  other                   = "<etag:'ERROR'> <body>The site refused that: <value><code><body>."
  not_linked              = "<etag:'ERROR'> <body>Link your account first: <value>/link<body>, or make a code on the site and type it after <value>/verify<body>."
  recipient_unknown       = "<etag:'ERROR'> <body>Nobody on the site answers to that name, or it could mean two people."
  insufficient_balance    = "<etag:'ERROR'> <body>You do not have enough credits for that."
  amount_invalid          = "<etag:'ERROR'> <body>That is not an amount: more than zero, two decimals at most."
  same_account            = "<etag:'ERROR'> <body>That is your own account."
  not_allowed             = "<etag:'ERROR'> <body>The site does not let this server do that. An admin can allow it."
  not_found               = "<etag:'ERROR'> <body>The site has no such thing any more."
  not_in_game             = "<etag:'ERROR'> <body>That is not for sale in game."
  out_of_stock            = "<etag:'ERROR'> <body>That has sold out."
  quantity_invalid        = "<etag:'ERROR'> <body>You cannot buy that many of it."
  field_invalid           = "<etag:'ERROR'> <body>The answer to <value><field><body> is missing or wrong."
  not_giftable            = "<etag:'ERROR'> <body>That cannot be given to someone else."
  recipient_refuses_gifts = "<etag:'ERROR'> <body>That member does not take gifts."
  already_claimed         = "<etag:'ERROR'> <body>That was already claimed."
  not_pending             = "<etag:'ERROR'> <body>That gift is no longer waiting."
  voucher_used            = "<etag:'ERROR'> <body>That voucher was already redeemed. It is worth nothing now."
  code_invalid            = "<etag:'ERROR'> <body>That code is wrong, used or expired. Make a new one."
  already_linked          = "<etag:'ERROR'> <body>This account or that member is already linked. Unlink it on the site first."
  needs_player_name       = "<etag:'ERROR'> <body>That item needs a player name. Claim it from the site's chest."
  unavailable             = "<etag:'ERROR'> <body>The site cannot do that right now. Try again later."
}

credits {
  balance       = "<tag:'BLYSIS'> <body>You have <value><balance><body> credits."
  sent          = "<tag:'BLYSIS'> <body>You sent <value><amount><body> credits to <value><to><body>. You have <value><balance><body> left."
  top-header    = "<h:'Top credits'>"
  top-line      = "<value>#<rank> <body><name> <subtext><amount>"
  top-anonymous = "<subtext>a member"
  top-empty     = "<tag:'BLYSIS'> <body>Nobody is on this list yet."
  admin-done    = "<tag:'BLYSIS'> <value><target><body> has <value><balance><body> credits."
}

# <link> is the site's page, and a click opens it.
link {
  code    = "<tag:'BLYSIS'> <body>Open <value><link><body> signed in and confirm <value><code><body>. It lasts ten minutes."
  done    = "<tag:'BLYSIS'> <body>This account is linked to <value><member><body> on the site."
  already = "<tag:'BLYSIS'> <body>This account is already linked to <value><member><body>."
}

voucher {
  created  = "<tag:'BLYSIS'> <body>A voucher of <value><amount><body> credits is in your inventory. It pays once, to whoever uses it."
  given    = "<tag:'BLYSIS'> <body>A voucher of <value><amount><body> credits went to <value><player><body>."
  received = "<tag:'BLYSIS'> <body>You were given a voucher of <value><amount><body> credits."
  redeemed = "<tag:'BLYSIS'> <body>The voucher paid <value><amount><body> credits."
  dropped  = "<tag:'BLYSIS'> <body>Your inventory is full, so the voucher is at your feet."
  not-held = "<etag:'ERROR'> <body>Hold the voucher in your hand."
  item {
    name = "<value><amount> credits"
    lore = "<body>A credit voucher."
    hint = "<subtext>Use it to add the credits to your account. It pays once."
  }
}

# The lines of the language branch. <language> is the name of one language, and <languages>
# is the list of the ones this plugin found. A language is a file in this folder: write
# messages_de.conf and German is offered, with no new build and no list to edit.
language {
  current   = "<tag:'BLYSIS'> <body>You read this in <value><language><body>."
  choices   = "<tag:'BLYSIS'> <body>You may read it in <value><languages><body>."
  changed   = "<tag:'BLYSIS'> <body>You now read this in <value><language><body>."
  already   = "<tag:'BLYSIS'> <body>You already read this in <value><language><body>."
  reset     = "<tag:'BLYSIS'> <body>You no longer have a language of your own."
  separator = "<dim>, "
  unknown   = "<etag:'ERROR'> <body>This server has no <value><input><body>. It has <value><languages><body>."
  forced    = "<etag:'ERROR'> <body>This server reads one language, and it is <value><language><body>."

  # What an operator reads after setting or clearing another player's language. <player>
  # is the player's name. A player who is away gets the change at their next join.
  set-player        = "<tag:'BLYSIS'> <value><player><body> now reads <value><language><body>."
  set-player-away   = "<tag:'BLYSIS'> <value><player><body> is away and reads <value><language><body> from their next join."
  reset-player      = "<tag:'BLYSIS'> <value><player><body> no longer has a language of their own."
  reset-player-away = "<tag:'BLYSIS'> <value><player><body> is away, and their language is cleared at their next join."
  forced-anyway     = "<tag:'BLYSIS'> <body>It is kept, and everyone reads <value><language><body> while that is forced."
  unknown-player    = "<etag:'ERROR'> <body>Nobody called <value><input><body> has played here."
}

# The lines the uxmLib command layer writes: the help page, a rejected argument, a cooldown.
# They are here so they are translated with the rest and painted from theme.conf. A value in
# angle brackets is inserted as written and never obeyed.
command {
  no-permission        = "<etag:'ERROR'> <body>You do not have permission to do that."
  player-only        = "<etag:'ERROR'> <body>Only a player can run this command."
  invalid-value      = "<etag:'ERROR'> <body><value><input><body> is not a valid <value><argument><body>."
  invalid-value-why  = "<etag:'ERROR'> <body><value><input><body> is not a valid <value><argument><body>: <subtext><reason>"
  not-one-of         = "<etag:'ERROR'> <body><value><input><body> is not a valid <value><argument><body>. Try one of <value><allowed><body>."
  invalid-argument   = "<etag:'ERROR'> <body><detail>"
  bad-argument       = "<etag:'ERROR'> <body>That argument is not valid."
  internal-error     = "<etag:'ERROR'> <body>Something went wrong while running this command. The console holds the reason."
  on-cooldown        = "<etag:'ERROR'> <body>Wait <value><time><body> before you use this again."
  help-header        = "<h:'Help'> <dim>/<value><command> <dim>(<value><page><dim>/<value><pages><dim>)"
  help-command       = "<value><command>"
  help-separator     = "<dim> : "
  help-description   = "<subtext><description>"
  help-fill-hint     = "<subtext>Click to write this command."
  help-page-hint     = "<subtext>Page <value><page>"
}
