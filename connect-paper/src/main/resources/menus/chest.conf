# The chest: what a player bought and has not taken, and the gifts that wait for them.
#
# The header of menus/store.conf explains the grammar. The material the plugin fills in:
#   %chest-icon%   the icon the site gives the thing, or icons.product in config.conf
#
# The actions this window knows:
#   blysis:claim        takes the thing that was clicked, or accepts the gift
#   blysis:open-store   opens the store
#   blysis:open-sent    opens the gifts this player sent
#   blysis:gifts        turns taking gifts on or off
#
# The facts a tile may name: count, sender, gift-state. The gift switch: receiving.

title = "@menu.chest.title"
rows = 6
open-actions = ["sound:BLOCK_CHEST_OPEN 0.6 1.1"]

items {

  things {
    slots = ["10-16", "19-25", "28-34"]
    priority = 5
    list {
      source = "blysis:chest"
      template {
        material = "%chest-icon%"
        name = " "
        lore = ["tile:5 @menu.chest.thing count gift-state sender"]
        click { left = ["blysis:claim", "sound:ENTITY_ITEM_PICKUP 0.6 1.2"] }
      }
    }
  }

  bar {
    slots = ["45-53"]
    priority = 1
    material = GRAY_STAINED_GLASS_PANE
    name = " "
  }

  store {
    slot = 45
    priority = 10
    material = FEATHER
    name = "@menu.button.store"
    click { left = ["blysis:open-store", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
  }

  sent {
    slot = 47
    priority = 10
    material = MINECART
    name = " "
    lore = ["tile:4 @menu.store.sent"]
    click { left = ["blysis:open-sent", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
  }

  gifts {
    slot = 49
    priority = 10
    material = CAKE
    name = " "
    lore = ["tile:4 @menu.chest.gifts receiving"]
    click { left = ["blysis:gifts", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
  }

  previous {
    slot = 52
    priority = 10
    type = previous
    material = ARROW
    name = "@menu.button.previous"
  }

  next {
    slot = 53
    priority = 10
    type = next
    material = ARROW
    name = "@menu.button.next"
  }
}
