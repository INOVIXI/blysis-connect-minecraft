# The single source of truth for every version in this build.
# Pin an exact version. Record the date on which the coordinate was verified.

[versions]
velocity       = "4.1.1"                   # com.velocitypowered:velocity-api (repo.papermc.io)
# Paper 26.2 and Velocity 4.1.1 both import adventure-bom 5.2.0, so one number serves both.
# It is compileOnly everywhere: each platform ships Adventure and MiniMessage itself.
adventure      = "5.2.0"                   # net.kyori:adventure-*
# language and platform
java           = "25"
paper          = "26.2.build.112-stable"   # io.papermc.paper:paper-api (verified 2026-08-28)

# our foundation
uxmlib = "0.168.0"                  # com.uxplima.uxmlib on repo.uxplima.com

# runtime libraries
configurate    = "4.1.2"
jspecify       = "1.0.0"
bstats         = "3.0.2"

# soft dependencies, compileOnly, reached only past a plugin-present guard
placeholderapi = "2.11.6"                  # me.clip:placeholderapi (extendedclip repo, not Maven Central)

# Paper and Velocity both ship Gson, so the common module reads JSON with it and never shades it.
gson           = "2.14.0"                  # com.google.code.gson:gson, the copy Paper and Velocity ship

# tests
junit          = "5.12.1"
assertj        = "3.27.3"
mockito        = "5.23.0"
mockbukkit     = "4.116.1"                 # org.mockbukkit.mockbukkit:mockbukkit-v26.2 (verified 2026-08-28)
archunit       = "1.4.2"                   # 1.3.0 bundles an ASM that rejects Java 25 bytecode and
                                           # silently imports zero classes, which defeats every fence

# tooling
errorprone     = "2.50.0"
nullaway       = "0.13.7"
spotless       = "8.7.0"
palantir-fmt   = "2.93.0"
shadow         = "9.4.1"
run-paper      = "3.0.2"

[libraries]
velocity-api      = { module = "com.velocitypowered:velocity-api",               version.ref = "velocity" }
# The text API Paper and Velocity share, so the common module writes against it and neither
# platform module has to translate. Never shaded: both platforms bundle it.
adventure-api     = { module = "net.kyori:adventure-api",                        version.ref = "adventure" }
adventure-mini    = { module = "net.kyori:adventure-text-minimessage",           version.ref = "adventure" }
adventure-plain   = { module = "net.kyori:adventure-text-serializer-plain",      version.ref = "adventure" }
paper-api         = { module = "io.papermc.paper:paper-api",                     version.ref = "paper" }
# Individual modules, never uxmlib-all. That artifact is the shaded standalone plugin jar:
# it relocates Configurate into com.uxplima.uxmlib.libs.configurate, and those internal types
# then appear in the signatures a consumer has to name. The per-module artifacts are clean.
uxmlib-common     = { module = "com.uxplima.uxmlib:uxmlib-common",               version.ref = "uxmlib" }
uxmlib-command    = { module = "com.uxplima.uxmlib:uxmlib-command",              version.ref = "uxmlib" }
uxmlib-item       = { module = "com.uxplima.uxmlib:uxmlib-item",                 version.ref = "uxmlib" }
uxmlib-gui        = { module = "com.uxplima.uxmlib:uxmlib-gui",                  version.ref = "uxmlib" }
uxmlib-menu       = { module = "com.uxplima.uxmlib:uxmlib-menu",                 version.ref = "uxmlib" }
uxmlib-condition  = { module = "com.uxplima.uxmlib:uxmlib-condition",            version.ref = "uxmlib" }
uxmlib-bedrock    = { module = "com.uxplima.uxmlib:uxmlib-bedrock",              version.ref = "uxmlib" }
uxmlib-storage    = { module = "com.uxplima.uxmlib:uxmlib-storage",              version.ref = "uxmlib" }
uxmlib-integration = { module = "com.uxplima.uxmlib:uxmlib-integration",         version.ref = "uxmlib" }
configurate-hocon = { module = "org.spongepowered:configurate-hocon",            version.ref = "configurate" }
jspecify          = { module = "org.jspecify:jspecify",                          version.ref = "jspecify" }
# bstats is here for the plugin that wants metrics. Nothing in the template builds a
# Metrics, so the template does not take it: an unused library is weight in every jar.
bstats-bukkit     = { module = "org.bstats:bstats-bukkit",                       version.ref = "bstats" }
gson              = { module = "com.google.code.gson:gson",                      version.ref = "gson" }
bstats-velocity   = { module = "org.bstats:bstats-velocity",                     version.ref = "bstats" }
placeholderapi    = { module = "me.clip:placeholderapi",                         version.ref = "placeholderapi" }

junit-bom         = { module = "org.junit:junit-bom",                            version.ref = "junit" }
junit-jupiter     = { module = "org.junit.jupiter:junit-jupiter" }
assertj           = { module = "org.assertj:assertj-core",                       version.ref = "assertj" }
mockito-core      = { module = "org.mockito:mockito-core",                       version.ref = "mockito" }
mockito-jupiter   = { module = "org.mockito:mockito-junit-jupiter",              version.ref = "mockito" }
mockbukkit        = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.2",     version.ref = "mockbukkit" }
archunit-junit    = { module = "com.tngtech.archunit:archunit-junit5",           version.ref = "archunit" }

errorprone-core   = { module = "com.google.errorprone:error_prone_core",         version.ref = "errorprone" }
errorprone-annos  = { module = "com.google.errorprone:error_prone_annotations",  version.ref = "errorprone" }
nullaway          = { module = "com.uber.nullaway:nullaway",                     version.ref = "nullaway" }

[bundles]
adventure = ["adventure-api", "adventure-mini", "adventure-plain"]
testing = ["junit-jupiter", "assertj", "mockito-core", "mockito-jupiter"]
# The foundation that every plugin takes. Add uxmlib-storage, -hud, -integration,
# -condition or -update to the build file when the plugin actually needs them.
uxmlib  = ["uxmlib-common", "uxmlib-command", "uxmlib-item", "uxmlib-gui", "uxmlib-menu",
           "uxmlib-condition", "uxmlib-bedrock"]

[plugins]
shadow    = { id = "com.gradleup.shadow",   version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
