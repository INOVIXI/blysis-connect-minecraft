# Site olaylarının oyunda söyledikleri, config.conf içindeki listelerden. <player> üyedir,
# site adını gizliyorsa "biri" kelimesi.
announce {
  purchase      = "<tag:'BLYSIS'> <value><player><body> sitede <value><quantity>x <product><body> satın aldı."
  topup         = "<tag:'BLYSIS'> <value><player><body> siteye <value><amount><body> kredi yükledi."
  goal-title    = "<good>Hedefe ulaşıldı"
  goal-subtitle = "<body><event-title>: <value><raised><body> / <value><goal>"
  someone       = "Biri"
  gift-received = "<tag:'BLYSIS'> <value><from><body> sana <value><quantity>x <product><body> gönderdi. Kabul edene kadar sandığında bekliyor."
}
staff {
  site-down = "<etag:'HATA'> <body>Site yanıt vermiyor. Teslimatlar orada bekliyor, site dönene kadar satın alma reddediliyor."
  site-back = "<tag:'BLYSIS'> <body>Site yeniden yanıt veriyor."
}
