# How this plugin asks a player to type something.
#
# Three places ask for a line of text, and every one of them works in each of these four ways, so
# changing one is always safe:
#
#   anvil  : a small anvil opens; the player types into the rename field and takes the result.
#   chat   : the window closes and the player types the answer as their next chat message.
#   sign   : a sign opens for editing; the line typed on it is the answer.
#   dialog : a native dialog screen opens. On a client or server that cannot show one this falls
#            back to sign, then anvil, and says so once rather than failing quietly.
#
# A Bedrock player always gets a native form with one field, whichever mode is set here.

# The mode used by any point not listed under `modes`. anvil, chat, sign or dialog.
default-mode = dialog

# Typing one of these instead of an answer aborts the prompt and puts the player back in the window
# they came from. The first one is the word shown in the hint.
cancel-keywords = ["cancel", "iptal"]

modes {
  # How many of a product to buy. A number, so a short field suits it.
  quantity = anvil

  # Who a gift is for: a name on the site or in game.
  recipient = chat

  # A question a product asks, such as the colour of a name. The site's own label is the prompt.
  field = dialog
}
