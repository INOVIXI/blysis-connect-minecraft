# The store: the site's shelves, and the products on the shelf a player opened.
#
# A menu is a file. Move a slot, change a material, take a button out, and the plugin draws what
# you wrote. The words are not in this file: every title, button name and tile line names a key
# of the message catalogue, so a translation never lives here.
#
# title        the key of the message catalogue the window is titled from, with a leading @
# rows         how many rows the window has, one to six
# slot/slots   where an item sits. A range is written "0-8", and a list mixes both
# priority     which item wins a slot two of them ask for. The highest is drawn last
# material     a material name, or a %value% the plugin fills in
# name         the key of a button's name, with a leading @. A tile writes a single space here
# lore         the lines under it. A tile is one line: "tile:<colour> @<key> <fact> <fact>"
# type         previous or next turns the page of the list
# click        what a left, a right, a shift left or a shift right click does
# list         the slots this item lays out are filled by the plugin, row by row
# chest-only   true keeps a Bedrock player on the chest window rather than a form
#
# The materials the plugin fills in:
#   %shelf_item%     the icon the site gives a shelf, or icons.shelf in config.conf
#   %product_item%   the icon the site gives a product, or icons.product in config.conf
#
# The actions this window knows:
#   blysis:shelf       opens the shelf that was clicked
#   blysis:product     opens the purchase window on the product that was clicked
#   blysis:back        one shelf up, or closes the store at the top
#   blysis:open-chest  opens the chest
#   blysis:open-sent   opens the gifts this player sent
#   blysis:gifts       turns taking gifts on or off
#   close, open:<menu>, command:<line>, message:<line>, sound:<name> <volume> <pitch>
#
# The facts a product tile may name: price, servers, stock.
# The facts the credit card may name: balance, site. The chest card: receiving.

title = "@menu.store.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {

  # The shelves on this shelf, or the shelves at the top of the store.
  shelves {
    slots = ["10-16"]
    priority = 5
    list {
      source = "blysis:shelves"
      template {
        material = "%shelf_item%"
        name = " "
        lore = ["tile:5 @menu.store.shelf"]
        click { left = ["blysis:shelf", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
      }
    }
  }

  # The products on this shelf. The top of the store holds shelves only.
  products {
    slots = ["19-25", "28-34"]
    priority = 5
    list {
      source = "blysis:products"
      template {
        material = "%product_item%"
        name = " "
        lore = ["tile:3 @menu.store.product price servers stock"]
        click { left = ["blysis:product", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
      }
    }
  }

  bar {
    slots = ["45-53"]
    priority = 1
    material = GRAY_STAINED_GLASS_PANE
    name = " "
  }

  back {
    slot = 45
    priority = 10
    material = FEATHER
    name = "@menu.button.back"
    click { left = ["blysis:back", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
  }

  sent {
    slot = 47
    priority = 10
    material = MINECART
    name = " "
    lore = ["tile:4 @menu.store.sent"]
    click { left = ["blysis:open-sent", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
  }

  credits {
    slot = 49
    priority = 10
    material = SUNFLOWER
    name = " "
    lore = ["tile:money @menu.store.credits balance site"]
  }

  chest {
    slot = 51
    priority = 10
    material = CHEST
    name = " "
    lore = ["tile:4 @menu.store.chest receiving"]
    click {
      left  = ["blysis:open-chest", "sound:UI_BUTTON_CLICK 0.5 1.6"]
      right = ["blysis:gifts", "sound:UI_BUTTON_CLICK 0.5 1.6"]
    }
  }

  previous {
    slot = 52
    priority = 10
    type = previous
    material = ARROW
    name = "@menu.button.previous"
  }

  next {
    slot = 53
    priority = 10
    type = next
    material = ARROW
    name = "@menu.button.next"
  }
}
