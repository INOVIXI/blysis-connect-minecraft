# Türkçe mesajlar.
#
# Her satır MiniMessage biçimindedir ve renk yerine rol adı kullanır: <body> metin,
# <value> bir ad veya bir sayı, <tag:'BLYSIS'> satırın başındaki etiket. Renkler
# theme.conf dosyasında durur.
#
# Türkçe küçük kapital harflerle yazılmaz, çünkü altı Türkçe harfin küçük kapitali yoktur.
# theme.conf içindeki small-caps.tr değeri bu yüzden false.

admin {
  version       = "<tag:'BLYSIS'> <body>BlysisConnect <value><version>"
  usage         = "<tag:'BLYSIS'> <body>Bu komutun yaptığı her şeyi görmek için sonuna <value>help<body> ekle."
  reloaded      = "<tag:'BLYSIS'> <body>Ayarlar yeniden yüklendi, <value><ms><body> ms içinde."
  reload-failed = "<etag:'HATA'> <body>Yeniden yükleme başarısız oldu. Nedeni konsolda yazıyor."

  doctor {
    header = "<h:'Bu eklenti nasil'>"
    ok     = "<good>iyi<body>  <value><check><body>: <subtext><said>"
    warn   = "<warn>uyari<body>  <value><check><body>: <subtext><said>"
    fail   = "<bad>hata<body>  <value><check><body>: <subtext><said>"
    well   = "<tag:'BLYSIS'> <body>Her şey cevap verdi."
    unwell = "<etag:'HATA'> <body>Yukarıda bir sorun var. Konsol tamamını taşıyor."
  }
}

# Oyuncunun sitedeki hesabı hakkında okudukları. <balance> ve <amount> kredidir.
account {
  not-connected  = "<etag:'HATA'> <body>Bu sunucu henüz siteye bağlı değil."
  away           = "<etag:'HATA'> <body>Site şu an cevap vermiyor. Hiçbir şey alınmadı; birazdan yeniden dene."
  unsure         = "<etag:'HATA'> <body>Site zamanında onaylamadı. Yeniden denemeden önce bakiyene bak."
  player-unknown = "<etag:'HATA'> <value><input><body> adında çevrimiçi kimse yok."
}

# Sitenin retleri, verebileceği her kod için bir satır. Bu dosyanın adını vermediği bir kod
# refused.other ile okunur, kod <code> içindedir.
refused {
  other                   = "<etag:'HATA'> <body>Site bunu reddetti: <value><code><body>."
  not_linked              = "<etag:'HATA'> <body>Önce hesabını bağla: <value>/link<body>, ya da sitede bir kod üret ve <value>/verify<body> ardından yaz."
  recipient_unknown       = "<etag:'HATA'> <body>Sitede bu ada cevap veren kimse yok, ya da iki kişi olabilir."
  insufficient_balance    = "<etag:'HATA'> <body>Bunun için yeterli kredin yok."
  amount_invalid          = "<etag:'HATA'> <body>Bu bir miktar değil: sıfırdan büyük, en fazla iki ondalık."
  same_account            = "<etag:'HATA'> <body>Bu senin kendi hesabın."
  not_allowed             = "<etag:'HATA'> <body>Site bu sunucunun bunu yapmasına izin vermiyor. Bir yönetici izin verebilir."
  not_found               = "<etag:'HATA'> <body>Sitede artık böyle bir şey yok."
  not_in_game             = "<etag:'HATA'> <body>Bu oyun içinde satılmıyor."
  out_of_stock            = "<etag:'HATA'> <body>Bunun stoğu bitti."
  quantity_invalid        = "<etag:'HATA'> <body>Bundan o kadar alamazsın."
  limit_reached           = "<etag:'HATA'> <body>Bundan bir hesaba ancak belli sayıda düşer ve alacak kişi o sınırı doldurdu."
  field_invalid           = "<etag:'HATA'> <body><value><field><body> cevabı eksik ya da yanlış."
  not_giftable            = "<etag:'HATA'> <body>Bu başkasına hediye edilemez."
  recipient_refuses_gifts = "<etag:'HATA'> <body>Bu üye hediye kabul etmiyor."
  already_claimed         = "<etag:'HATA'> <body>Bu zaten alınmış."
  not_pending             = "<etag:'HATA'> <body>Bu hediye artık beklemiyor."
  voucher_used            = "<etag:'HATA'> <body>Bu kupon zaten bozdurulmuş. Artık değeri yok."
  code_invalid            = "<etag:'HATA'> <body>Bu kod yanlış, kullanılmış ya da süresi dolmuş. Yenisini üret."
  already_linked          = "<etag:'HATA'> <body>Bu hesap ya da o üye zaten bağlı. Önce sitede bağlantıyı kaldır."
  needs_player_name       = "<etag:'HATA'> <body>Bu eşya bir oyuncu adı istiyor. Sitedeki sandıktan al."
  unavailable             = "<etag:'HATA'> <body>Bu hesap bunu şu an alamaz. Nedenini sitedeki mağaza sayfası söyler."
}

credits {
  balance       = "<tag:'BLYSIS'> <body><value><balance><body> kredin var."
  balance-remembered = "<tag:'BLYSIS'> <body>Site en son cevap verdiğinde <value><balance><body> kredin vardı. Şu an cevap vermiyor, bu yüzden değişmiş olabilir."
  sent          = "<tag:'BLYSIS'> <value><to><body> adlı üyeye <value><amount><body> kredi gönderdin. <value><balance><body> kredin kaldı."
  top-header    = "<h:'En çok kredi'>"
  top-line      = "<rank>#<place> <body><name> <subtext><amount>"
  top-anonymous = "<subtext>bir üye"
  top-empty     = "<tag:'BLYSIS'> <body>Bu listede henüz kimse yok."
  admin-done    = "<tag:'BLYSIS'> <value><target><body> adlı üyenin <value><balance><body> kredisi var."
}

# <link> sitenin sayfası, tıklayınca açılır.
link {
  code    = "<tag:'BLYSIS'> <body><value><link><body> sayfasını oturum açıkken aç ve <value><code><body> kodunu onayla. On dakika geçerli."
  done    = "<tag:'BLYSIS'> <body>Bu hesap sitede <value><member><body> üyesine bağlandı."
  already = "<tag:'BLYSIS'> <body>Bu hesap zaten <value><member><body> üyesine bağlı."
}

voucher {
  created  = "<tag:'BLYSIS'> <body><value><amount><body> kredilik bir kupon envanterinde. Kim kullanırsa ona bir kez öder."
  given    = "<tag:'BLYSIS'> <value><player><body> adlı oyuncuya <value><amount><body> kredilik bir kupon gitti."
  received = "<tag:'BLYSIS'> <body>Sana <value><amount><body> kredilik bir kupon verildi."
  redeemed = "<tag:'BLYSIS'> <body>Kupon <value><amount><body> kredi ödedi."
  dropped  = "<tag:'BLYSIS'> <body>Envanterin dolu, kupon ayağının dibinde."
  not-held = "<etag:'HATA'> <body>Kuponu elinde tut."
  item {
    name = "<value><amount> kredi"
    lore = "<body>Bir kredi kuponu."
    hint = "<subtext>Kredileri hesabına eklemek için kullan. Bir kez öder."
  }
}

# Dil dalının satırları. <language> tek bir dilin adı, <languages> bu eklentinin bulduğu
# dillerin listesi. Bir dil bu klasördeki bir dosyadır: messages_de.conf yaz, Almanca
# sunulur. Yeni bir derleme gerekmez ve düzenlenecek bir liste yoktur.
language {
  current   = "<tag:'BLYSIS'> <body>Bunu <value><language><body> okuyorsun."
  choices   = "<tag:'BLYSIS'> <body>Şu dillerde okuyabilirsin: <value><languages><body>."
  changed   = "<tag:'BLYSIS'> <body>Artık bunu <value><language><body> okuyorsun."
  already   = "<tag:'BLYSIS'> <body>Bunu zaten <value><language><body> okuyorsun."
  reset     = "<tag:'BLYSIS'> <body>Artık kendi seçtiğin bir dil yok."
  separator = "<dim>, "
  unknown   = "<etag:'HATA'> <body>Bu sunucuda <value><input><body> yok. Olanlar: <value><languages><body>."
  forced    = "<etag:'HATA'> <body>Bu sunucu tek dil okur, o da <value><language><body>."

  # Bir yöneticinin başka bir oyuncunun dilini ayarladıktan ya da sildikten sonra okuduğu
  # satırlar. <player> oyuncunun adı. Sunucuda olmayan oyuncu değişikliği ilk girişinde alır.
  set-player        = "<tag:'BLYSIS'> <value><player><body> artık <value><language><body> okuyor."
  set-player-away   = "<tag:'BLYSIS'> <value><player><body> şu an yok, bir sonraki girişinden itibaren <value><language><body> okuyacak."
  reset-player      = "<tag:'BLYSIS'> <value><player><body> için seçilmiş bir dil artık yok."
  reset-player-away = "<tag:'BLYSIS'> <value><player><body> şu an yok, dil seçimi bir sonraki girişinde silinecek."
  forced-anyway     = "<tag:'BLYSIS'> <body>Kaydedildi, ama dil zorunlu olduğu sürece herkes <value><language><body> okuyor."
  unknown-player    = "<etag:'HATA'> <body><value><input><body> adında biri burada hiç oynamadı."
}

# uxmLib komut katmanının yazdığı satırlar: yardım sayfası, reddedilen bir argüman, bekleme
# süresi. Burada duruyorlar ki geri kalanla birlikte çevrilsinler ve theme.conf ile boyansınlar.
# Köşeli parantez içindeki değer yazıldığı gibi eklenir ve asla çalıştırılmaz.
command {
  no-permission        = "<etag:'HATA'> <body>Bunu yapma yetkin yok."
  player-only        = "<etag:'HATA'> <body>Bu komutu sadece bir oyuncu çalıştırabilir."
  invalid-value      = "<etag:'HATA'> <body><value><input><body> geçerli bir <value><argument><body> değil."
  invalid-value-why  = "<etag:'HATA'> <body><value><input><body> geçerli bir <value><argument><body> değil: <subtext><reason>"
  not-one-of         = "<etag:'HATA'> <body><value><input><body> geçerli bir <value><argument><body> değil. Şunlardan birini dene: <value><allowed><body>."
  invalid-argument   = "<etag:'HATA'> <body><detail>"
  bad-argument       = "<etag:'HATA'> <body>Bu argüman geçerli değil."
  internal-error     = "<etag:'HATA'> <body>Bu komut çalışırken bir şey ters gitti. Nedeni konsolda yazıyor."
  on-cooldown        = "<etag:'HATA'> <body>Bunu tekrar kullanmadan önce <value><time><body> bekle."
  help-header        = "<h:'Yardım'> <dim>/<value><command> <dim>(<value><page><dim>/<value><pages><dim>)"
  help-command       = "<value><command>"
  help-separator     = "<dim> : "
  help-description   = "<subtext><description>"
  help-fill-hint     = "<subtext>Bu komutu yazmak için tıkla."
  help-page-hint     = "<subtext>Sayfa <value><page>"
}

# Mağaza ve sandık. <product> ve <thing> sitenin kendi adları, <total> ve <balance> kredi,
# <to> hediyenin gittiği üye.
# Pencerelerin kelimeleri. Bir karo bir anahtar bloğudur: başlık, altındaki yol, açıklama,
# tıklamanın ne yaptığını söyleyen satır ve her bilgi için bir blok. Karonun hangi bilgileri
# göstereceği menus/ altında seçilir. <path> mağazanın tepesinden aşağı rafların yoludur.
menu {
  missing = "<etag:'HATA'> <body><value><menu><body> penceresi bu sunucuda yok."

  lore {
    description = "Açıklama"
    details     = "Ayrıntılar"
  }

  button {
    back     = "<accent>« Geri"
    store    = "<accent>« Mağaza"
    previous = "<accent>← Önceki sayfa"
    next     = "<accent>→ Sonraki sayfa"
    minus-10 = "<bad>- 10"
    minus-1  = "<bad>- 1"
    plus-1   = "<good>+ 1"
    plus-10  = "<good>+ 10"
  }

  store {
    title = "Mağaza<path>"

    shelf {
      title       = "<name>"
      crumb       = "Raf"
      description = "<about>"
      action      = "<cta>Tıkla<subtext>, rafı aç"
    }

    product {
      title       = "<name>"
      crumb       = "Ürün"
      description = "<about>"
      action      = "<cta>Tıkla<subtext>, satın al ya da hediye et"
      price       { label = "Fiyat", value = "<money><price> kredi" }
      servers     { label = "Teslim edildiği yer", value = "<servers>" }
      stock       { label = "Kalan", value = "<stock>" }
    }

    sent {
      title       = "Gönderilen hediyeler"
      crumb       = "Hediyeler"
      description = "Başkaları için aldığın hediyeler. Henüz kabul edilmeyeni geri alabilirsin."
      action      = "<cta>Tıkla<subtext>, listeyi gör"
    }

    credits {
      title       = "Kredilerin"
      crumb       = "Kredi"
      description = "Kredi sitede satın alınır."
      action      = "<subtext>Sitede yükleme yap"
      balance     { label = "Bakiye", value = "<money><balance>" }
      site        { label = "Site", value = "<site>" }
    }

    chest {
      title       = "Sandığın"
      crumb       = "Sandık"
      description = "Aldığın ama henüz teslim almadığın şeyler ve seni bekleyen hediyeler."
      action      = "<cta>Sol tık<subtext>, sandığı aç\n<cta>Sağ tık<subtext>, hediye almayı aç ya da kapat"
      receiving   { label = "Hediye alıyor", value = "<receiving>" }
    }
  }

  basket {
    title = "Mağaza<path> › Satın al"

    product {
      title       = "<name>"
      crumb       = "Ürün"
      description = "<about>"
      action      = "<subtext>Aşağıdaki düğmeler adedi ve alıcıyı seçer"
      price       { label = "Fiyat", value = "<money><price> kredi" }
      servers     { label = "Teslim edildiği yer", value = "<servers>" }
      stock       { label = "Kalan", value = "<stock>" }
    }

    quantity {
      title       = "Kaç tane"
      crumb       = "Adet"
      description = "Yanındaki düğmeler adedi değiştirir."
      action      = "<cta>Tıkla<subtext>, sayı yaz"
      quantity    { label = "Adet", value = "<quantity>" }
      most        { label = "En çok", value = "<most>" }
    }

    recipient {
      title       = "Kime"
      crumb       = "Alıcı"
      description = "Hediye, kabul edene kadar alıcının sandığında bekler."
      action      = "<cta>Sol tık<subtext>, birine hediye et\n<cta>Sağ tık<subtext>, kendin için al"
      recipient   { label = "Alıcı", value = "<recipient>" }
    }

    confirm {
      title       = "Satın al"
      crumb       = "Onay"
      description = "<name>"
      action      = "<cta>Tıkla<subtext>, satın al. Ürünün soruları önce sorulur."
      recipient   { label = "Alıcı", value = "<recipient>" }
      quantity    { label = "Adet", value = "<quantity>" }
      price       { label = "Tanesi", value = "<money><price>" }
      total       { label = "Toplam", value = "<money><total>" }
      balance     { label = "Şimdiki bakiye", value = "<money><balance>" }
      after       { label = "Sonraki bakiye", value = "<money><after>" }
    }
  }

  recipients {
    title = "Kime"

    someone {
      title       = "<someone>"
      crumb       = "Oyuncu"
      description = "Hediye, kabul edene kadar alıcının sandığında bekler."
      action      = "<cta>Tıkla<subtext>, ona hediye et"
    }

    type {
      title       = "Başka biri"
      crumb       = "Üye"
      description = "Çevrimiçi olmayan bir üye, sitedeki ya da oyundaki adıyla."
      action      = "<cta>Tıkla<subtext>, adı yaz"
    }
  }

  options {
    title = "Seç"

    option {
      title       = "<choice>"
      crumb       = "Cevap"
      description = "<name>"
      action      = "<cta>Tıkla<subtext>, bunu seç"
      question    { label = "Soru", value = "<question>" }
    }
  }

  chest {
    title = "Sandık"

    thing {
      title       = "<thing>"
      crumb       = "Sandık"
      description = "Sitede alındı, sen teslim alana kadar burada bekler."
      action      = "<cta>Tıkla<subtext>, teslim al ya da hediyeyi kabul et"
      count       { label = "Adet", value = "<count>" }
      gift-state  { label = "Durum", value = "<gift-state>" }
      sender      { label = "Gönderen", value = "<sender>" }
    }

    gifts {
      title       = "Hediyeler"
      crumb       = "Ayar"
      description = "Diğer üyelerin senin için bir şey alıp alamayacağı."
      action      = "<cta>Tıkla<subtext>, tersine çevir"
      receiving   { label = "Hediye alıyor", value = "<receiving>" }
    }
  }

  sent {
    title = "Gönderilen hediyeler"

    gift {
      title       = "<thing>"
      crumb       = "Hediye"
      description = "Aldığın bir hediye. Kabul edilene kadar geri alırsan kredinin tamamı döner."
      action      = "<cta>Tıkla<subtext>, geri al"
      count       { label = "Adet", value = "<count>" }
      to          { label = "Alıcı", value = "<to>" }
      gift-state  { label = "Durum", value = "<gift-state>" }
    }
  }
}

