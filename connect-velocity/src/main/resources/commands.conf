# Rename, alias, or turn off any command on the proxy.
#
# The key on the left never changes. Only the values do. A change here needs a proxy restart.
#
# name    the label a player types, without the slash
# aliases other labels that reach the same command
# enabled set to false and the command is never registered
#
# A command the proxy registers is answered by the proxy and never reaches the server behind
# it. On a network where every server runs BlysisConnect as well, turn one of the two off, or
# give one of them another name.

commands {
  credits {
    name    = "credits"
    aliases = ["credit"]
    enabled = true
  }
  link {
    name    = "link"
    aliases = []
    enabled = true
  }
  verify {
    name    = "verify"
    aliases = []
    enabled = true
  }
  blysisproxy {
    name    = "blysisproxy"
    aliases = []
    enabled = true
  }
}
