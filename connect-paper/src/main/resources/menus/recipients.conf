# Who a gift is for: the players online, and a button to type the name of a member who is not.
#
# The header of menus/store.conf explains the grammar. The material the plugin fills in:
#   skull:%someone%   the head of the player a tile is drawn for
#
# The actions this window knows:
#   blysis:pick        makes the gift for the player that was clicked
#   blysis:type-name   asks for a name, in the mode text-input.conf gives "recipient"
#   blysis:basket      back to the purchase window
#
# The fact a tile may name: someone.

title = "@menu.recipients.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {

  people {
    slots = ["10-16", "19-25", "28-34"]
    priority = 5
    list {
      source = "blysis:people"
      template {
        material = "skull:%someone%"
        name = " "
        lore = ["tile:4 @menu.recipients.someone"]
        click { left = ["blysis:pick", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
      }
    }
  }

  bar {
    slots = ["45-53"]
    priority = 1
    material = GRAY_STAINED_GLASS_PANE
    name = " "
  }

  back {
    slot = 45
    priority = 10
    material = FEATHER
    name = "@menu.button.back"
    click { left = ["blysis:basket", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
  }

  type {
    slot = 49
    priority = 10
    material = NAME_TAG
    name = " "
    lore = ["tile:5 @menu.recipients.type"]
    click { left = ["blysis:type-name", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
  }

  previous {
    slot = 52
    priority = 10
    type = previous
    material = ARROW
    name = "@menu.button.previous"
  }

  next {
    slot = 53
    priority = 10
    type = next
    material = ARROW
    name = "@menu.button.next"
  }
}
