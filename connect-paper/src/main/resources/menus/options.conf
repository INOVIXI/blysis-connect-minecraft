# The answers one question of a product allows, when the site lists them.
#
# The header of menus/store.conf explains the grammar. The actions this window knows:
#   blysis:choose   takes the answer that was clicked and goes on to the next question
#   blysis:back     back to the purchase window
#
# The facts a tile may name: question.

title = "@menu.options.title"
rows = 4
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {

  options {
    slots = ["10-16", "19-25"]
    priority = 5
    list {
      source = "blysis:options"
      template {
        material = PAPER
        name = " "
        lore = ["tile:5 @menu.options.option question"]
        click { left = ["blysis:choose", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
      }
    }
  }

  bar {
    slots = ["27-35"]
    priority = 1
    material = GRAY_STAINED_GLASS_PANE
    name = " "
  }

  back {
    slot = 27
    priority = 10
    material = FEATHER
    name = "@menu.button.back"
    click { left = ["blysis:back", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
  }

  previous {
    slot = 34
    priority = 10
    type = previous
    material = ARROW
    name = "@menu.button.previous"
  }

  next {
    slot = 35
    priority = 10
    type = next
    material = ARROW
    name = "@menu.button.next"
  }
}
