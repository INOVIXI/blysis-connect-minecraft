# English messages.
#
# Every line is MiniMessage, and every line names a role instead of a colour: <body> is the
# text, <value> is a name or a number, <tag:'BLYSIS'> is the prefix a chat line opens with.
# The colours behind those names live in theme.conf.
#
# Write ordinary words here. The plugin converts English into small capitals when it renders
# the line, so this file stays readable for a translator.
#
# A key that is missing here falls back to the default that the code carries, so the plugin
# can never show an empty message. Delete a line to take the default back.

admin {
  version       = "<tag:'BLYSIS'> <body>BlysisConnect <value><version>"
  usage         = "<tag:'BLYSIS'> <body>Add <value>help<body> after this command to see everything it does."
  reloaded      = "<tag:'BLYSIS'> <body>The configuration is loaded again, in <value><ms><body> ms."
  reload-failed = "<etag:'ERROR'> <body>The reload failed. The console holds the reason."

  doctor {
    header = "<h:'How this plugin is'>"
    ok     = "<good>ok<body>  <value><check><body>: <subtext><said>"
    warn   = "<warn>warn<body>  <value><check><body>: <subtext><said>"
    fail   = "<bad>fail<body>  <value><check><body>: <subtext><said>"
    well   = "<tag:'BLYSIS'> <body>Everything answered."
    unwell = "<etag:'ERROR'> <body>Something is wrong above. The console carries the whole of it."
  }
}

# What a player reads about their account on the site. <balance> and <amount> are credits.
account {
  not-connected  = "<etag:'ERROR'> <body>This server is not connected to the site yet."
  away           = "<etag:'ERROR'> <body>The site does not answer right now. Nothing was taken; try again in a moment."
  silent         = "<etag:'ERROR'> <body>The site does not answer right now. Try again in a moment."
  unsure         = "<etag:'ERROR'> <body>The site did not confirm in time. Look at your balance before you try again."
  player-unknown = "<etag:'ERROR'> <body>Nobody called <value><input><body> is online."
}

# The site's refusals, one line per code it can answer. A code this file does not name reads
# refused.other, with the code in <code>.
refused {
  other                   = "<etag:'ERROR'> <body>The site refused that: <value><code><body>."
  not_linked              = "<etag:'ERROR'> <body>Link your account first: <value>/link<body>, or make a code on the site and type it after <value>/verify<body>."
  recipient_unknown       = "<etag:'ERROR'> <body>Nobody on the site answers to that name, or it could mean two people."
  insufficient_balance    = "<etag:'ERROR'> <body>You do not have enough credits for that."
  amount_invalid          = "<etag:'ERROR'> <body>That is not an amount: more than zero, at most 99999999, two decimals at most."
  same_account            = "<etag:'ERROR'> <body>That is your own account."
  not_allowed             = "<etag:'ERROR'> <body>The site does not let this server do that. An admin can allow it."
  not_found               = "<etag:'ERROR'> <body>The site has no such thing any more."
  not_in_game             = "<etag:'ERROR'> <body>That is not for sale in game."
  out_of_stock            = "<etag:'ERROR'> <body>That has sold out."
  quantity_invalid        = "<etag:'ERROR'> <body>You cannot buy that many of it."
  limit_reached           = "<etag:'ERROR'> <body>One account may own only so many of that, and whoever it is for has reached it."
  field_invalid           = "<etag:'ERROR'> <body>The answer to <value><field><body> is missing or wrong."
  not_giftable            = "<etag:'ERROR'> <body>That cannot be given to someone else."
  recipient_refuses_gifts = "<etag:'ERROR'> <body>That member does not take gifts."
  already_claimed         = "<etag:'ERROR'> <body>That was already claimed."
  not_pending             = "<etag:'ERROR'> <body>That gift is no longer waiting."
  voucher_used            = "<etag:'ERROR'> <body>That voucher was already redeemed. It is worth nothing now."
  code_invalid            = "<etag:'ERROR'> <body>That code is wrong, used or expired. Make a new one."
  rate_limited            = "<etag:'ERROR'> <body>That was tried too often. Wait a few minutes, then try again."
  already_linked          = "<etag:'ERROR'> <body>This account or that member is already linked. Unlink it on the site first."
  needs_player_name       = "<etag:'ERROR'> <body>That item needs a player name. Claim it from the site's chest."
  unavailable             = "<etag:'ERROR'> <body>That cannot be bought by this account right now. The store page on the site says why."
}

credits {
  balance       = "<tag:'BLYSIS'> <body>You have <value><balance><body> credits."
  balance-remembered = "<tag:'BLYSIS'> <body>You had <value><balance><body> credits when the site last answered. It does not answer now, so this may have changed."
  sent          = "<tag:'BLYSIS'> <body>You sent <value><amount><body> credits to <value><to><body>. You have <value><balance><body> left."
  top-header    = "<h:'Top credits'>"
  top-line      = "<rank>#<place> <body><name> <subtext><amount>"
  top-anonymous = "<subtext>a member"
  top-empty     = "<tag:'BLYSIS'> <body>Nobody is on this list yet."
  admin-done    = "<tag:'BLYSIS'> <value><target><body> has <value><balance><body> credits."
}

# <link> is the site's page, and a click opens it.
link {
  code    = "<tag:'BLYSIS'> <body>Open <value><link><body> signed in and confirm <value><code><body>. It lasts ten minutes."
  done    = "<tag:'BLYSIS'> <body>This account is linked to <value><member><body> on the site."
  already = "<tag:'BLYSIS'> <body>This account is already linked to <value><member><body>."
}

voucher {
  created  = "<tag:'BLYSIS'> <body>A voucher of <value><amount><body> credits is in your inventory. It pays once, to whoever uses it."
  given    = "<tag:'BLYSIS'> <body>A voucher of <value><amount><body> credits went to <value><player><body>."
  received = "<tag:'BLYSIS'> <body>You were given a voucher of <value><amount><body> credits."
  redeemed = "<tag:'BLYSIS'> <body>The voucher paid <value><amount><body> credits."
  dropped  = "<tag:'BLYSIS'> <body>Your inventory is full, so the voucher is at your feet."
  returned = "<tag:'BLYSIS'> <body><player> left before the voucher reached them, so its <value><amount><body> credits went back to their balance."
  unreturned = "<etag:'ERROR'> <body><player> left before the voucher reached them, and the site could not take it back. Redeem <value><id><body> for them from the site."
  not-held = "<etag:'ERROR'> <body>Hold the voucher in your hand."
  item {
    name = "<value><amount> credits"
    lore = "<body>A credit voucher."
    hint = "<subtext>Use it to add the credits to your account. It pays once."
  }
}

# The lines of the language branch. <language> is the name of one language, and <languages>
# is the list of the ones this plugin found. A language is a file in this folder: write
# messages_de.conf and German is offered, with no new build and no list to edit.
language {
  current   = "<tag:'BLYSIS'> <body>You read this in <value><language><body>."
  choices   = "<tag:'BLYSIS'> <body>You may read it in <value><languages><body>."
  changed   = "<tag:'BLYSIS'> <body>You now read this in <value><language><body>."
  already   = "<tag:'BLYSIS'> <body>You already read this in <value><language><body>."
  reset     = "<tag:'BLYSIS'> <body>You no longer have a language of your own."
  separator = "<dim>, "
  unknown   = "<etag:'ERROR'> <body>This server has no <value><input><body>. It has <value><languages><body>."
  forced    = "<etag:'ERROR'> <body>This server reads one language, and it is <value><language><body>."

  # What an operator reads after setting or clearing another player's language. <player>
  # is the player's name. A player who is away gets the change at their next join.
  set-player        = "<tag:'BLYSIS'> <value><player><body> now reads <value><language><body>."
  set-player-away   = "<tag:'BLYSIS'> <value><player><body> is away and reads <value><language><body> from their next join."
  reset-player      = "<tag:'BLYSIS'> <value><player><body> no longer has a language of their own."
  reset-player-away = "<tag:'BLYSIS'> <value><player><body> is away, and their language is cleared at their next join."
  forced-anyway     = "<tag:'BLYSIS'> <body>It is kept, and everyone reads <value><language><body> while that is forced."
  unknown-player    = "<etag:'ERROR'> <body>Nobody called <value><input><body> has played here."
}

# The lines the uxmLib command layer writes: the help page, a rejected argument, a cooldown.
# They are here so they are translated with the rest and painted from theme.conf. A value in
# angle brackets is inserted as written and never obeyed.
command {
  # What an argument is called in this language, where a line below names it as <argument>.
  argument {
    kind     = "list"
    period   = "period"
    to       = "member"
    amount   = "amount"
    player   = "player"
    code     = "code"
    language = "language"
  }
  no-permission        = "<etag:'ERROR'> <body>You do not have permission to do that."
  player-only        = "<etag:'ERROR'> <body>Only a player can run this command."
  invalid-value      = "<etag:'ERROR'> <body><value><input><body> is not a valid <value><argument><body>."
  invalid-value-why  = "<etag:'ERROR'> <body><value><input><body> is not a valid <value><argument><body>: <subtext><reason>"
  not-one-of         = "<etag:'ERROR'> <body><value><input><body> is not a valid <value><argument><body>. Try one of <value><allowed><body>."
  invalid-argument   = "<etag:'ERROR'> <body><detail>"
  bad-argument       = "<etag:'ERROR'> <body>That argument is not valid."
  internal-error     = "<etag:'ERROR'> <body>Something went wrong while running this command. The console holds the reason."
  on-cooldown        = "<etag:'ERROR'> <body>Wait <value><time><body> before you use this again."
  help-header        = "<h:'Help'> <dim>/<value><command> <dim>(<value><page><dim>/<value><pages><dim>)"
  help-command       = "<value><command>"
  help-separator     = "<dim> : "
  help-description   = "<subtext><description>"
  help-fill-hint     = "<subtext>Click to write this command."
  help-page-hint     = "<subtext>Page <value><page>"
}

# The store and the chest. <product> and <thing> are the site's own names, <total> and
# <balance> are credits, <to> is who a gift is for.
# The words the windows are drawn from. A tile is a block of keys: the title, the crumb under it,
# the description, the line that says what a click does, and one block per fact. Which facts a
# tile shows is decided in menus/, so taking a word off a lore line there takes the fact off the
# tile and nothing here has to change. <path> is the shelves from the top of the store down.
menu {
  missing = "<etag:'ERROR'> <body>The <value><menu><body> window is not on this server."

  lore {
    description = "Description"
    details     = "Details"
  }

  button {
    back     = "<accent>« Back"
    store    = "<accent>« Store"
    previous = "<accent>← Previous page"
    next     = "<accent>→ Next page"
    minus-10 = "<bad>- 10"
    minus-1  = "<bad>- 1"
    plus-1   = "<good>+ 1"
    plus-10  = "<good>+ 10"
  }

  store {
    title = "Store<path>"

    shelf {
      title       = "<name>"
      crumb       = "Shelf"
      description = "<about>"
      action      = "<cta>Click<subtext> to open it"
    }

    product {
      title       = "<name>"
      crumb       = "Product"
      description = "<about>"
      action      = "<cta>Click<subtext> to buy it, or to give it"
      price       { label = "Price", value = "<money><price> credits" }
      servers     { label = "Delivered on", value = "<servers>" }
      stock       { label = "Left", value = "<stock>" }
    }

    sent {
      title       = "Sent gifts"
      crumb       = "Gifts"
      description = "The gifts you bought for others. One nobody accepted yet can be taken back."
      action      = "<cta>Click<subtext> to see them"
    }

    credits {
      title       = "Your credits"
      crumb       = "Credits"
      description = "Credits are bought on the site."
      action      = "<cta>Click<subtext> to hear your balance. Top up on the site"
      balance     { label = "Balance", value = "<money><balance>" }
      site        { label = "Site", value = "<site>" }
    }

    chest {
      title       = "Your chest"
      crumb       = "Chest"
      description = "What you bought and have not taken, and the gifts that wait for you."
      action      = "<cta>Left click<subtext> to open it\n<cta>Right click<subtext> to turn gifts on or off"
      receiving   { label = "Taking gifts", value = "<receiving>" }
      gestures    { left = "Open your chest", right = "Turn gifts on or off" }
    }
  }

  basket {
    title = "Store<path> › Purchase"

    product {
      title       = "<name>"
      crumb       = "Product"
      description = "<about>"
      action      = "<cta>Click<subtext> to read all of it in chat. The buttons below set how many and for whom"
      price       { label = "Price", value = "<money><price> credits" }
      servers     { label = "Delivered on", value = "<servers>" }
      stock       { label = "Left", value = "<stock>" }
    }

    quantity {
      title       = "How many"
      crumb       = "Quantity"
      description = "The buttons beside this one change it."
      action      = "<cta>Click<subtext> to type a number"
      quantity    { label = "How many", value = "<quantity>" }
      most        { label = "At most", value = "<most>" }
    }

    recipient {
      title       = "For whom"
      crumb       = "Recipient"
      description = "A gift waits in their chest until they accept it."
      action      = "<cta>Left click<subtext> to give it to someone\n<cta>Right click<subtext> to buy it for yourself"
      recipient   { label = "For", value = "<recipient>" }
      gestures    { left = "Give it to someone", right = "Buy it for yourself" }
    }

    confirm {
      title       = "Buy"
      crumb       = "Confirm"
      description = "<name>"
      action      = "<cta>Click<subtext> to buy it. Questions the product has come first."
      recipient   { label = "For", value = "<recipient>" }
      quantity    { label = "How many", value = "<quantity>" }
      price       { label = "Each", value = "<money><price>" }
      total       { label = "Total", value = "<money><total>" }
      balance     { label = "Balance now", value = "<money><balance>" }
      after       { label = "Balance after", value = "<money><after>" }
      short       { label = "Not enough by", value = "<money><short>" }
    }
  }

  recipients {
    title = "Who is it for"

    someone {
      title       = "<someone>"
      crumb       = "Player"
      description = "A gift waits in their chest until they accept it."
      action      = "<cta>Click<subtext> to give it to them"
    }

    type {
      title       = "Somebody else"
      crumb       = "Member"
      description = "A member who is not online, by their name on the site or in game."
      action      = "<cta>Click<subtext> to type the name"
    }
  }

  options {
    title = "Choose"

    option {
      title       = "<choice>"
      crumb       = "Answer"
      description = "<name>"
      action      = "<cta>Click<subtext> to choose it"
      question    { label = "Question", value = "<question>" }
    }
  }

  chest {
    title = "Chest"

    thing {
      title       = "<thing>"
      crumb       = "Chest"
      description = "Bought on the site, kept here until you take it."
      action      = "<cta>Click<subtext> to take it, or to accept the gift"
      count       { label = "How many", value = "<count>" }
      gift-state  { label = "State", value = "<gift-state>" }
      sender      { label = "From", value = "<sender>" }
    }

    gifts {
      title       = "Gifts"
      crumb       = "Settings"
      description = "Whether other members may buy things for you."
      action      = "<cta>Click<subtext> to turn it the other way"
      receiving   { label = "Taking gifts", value = "<receiving>" }
    }
  }

  sent {
    title = "Sent gifts"

    gift {
      title       = "<thing>"
      crumb       = "Gift"
      description = "A gift you bought. Until it is accepted you can take it back for a full refund."
      action      = "<cta>Click<subtext> to take it back"
      actions     { waiting = "<cta>Click<subtext> to take it back", accepted = "<subtext>Accepted, so it is theirs now" }
      count       { label = "How many", value = "<count>" }
      to          { label = "For", value = "<to>" }
      gift-state  { label = "State", value = "<gift-state>" }
    }
  }
}

store {
  empty        = "<tag:'BLYSIS'> <body>The store has nothing for sale in game yet."
  stale        = "<warn>The site does not answer, so this is the store as it last was. Buying waits until it is back."
  every-server = "every server"
  unlimited    = "unlimited"
  yourself     = "yourself"
  not-giftable = "<etag:'ERROR'> <body>That cannot be given to someone else."
  described    = "<tag:'BLYSIS'> <value><product><body>: <description>"
  undescribed  = "<tag:'BLYSIS'> <value><product><body> says nothing more about itself."
  bought       = "<tag:'BLYSIS'> <body>You bought <value><quantity>x <product><body> for <value><total><body> credits. You have <value><balance><body> left. Order <value><order><body>."
  gifted       = "<tag:'BLYSIS'> <body>You gave <value><quantity>x <product><body> to <value><to><body> for <value><total><body> credits. You can take it back until they accept it."
}

input {
  quantity  = "<body>How many?"
  recipient = "<body>Who is it for? Their name on the site or in game."
  field     = "<body><field>"
}

chest {
  gifts-on  = "<tag:'BLYSIS'> <body>You take gifts now."
  gifts-off = "<tag:'BLYSIS'> <body>You no longer take gifts. A purchase for you is refused before anyone pays."
  claimed   = "<tag:'BLYSIS'> <value><thing><body> is on its way to you."
  accepted  = "<tag:'BLYSIS'> <body>You accepted <value><thing><body>. It is in your chest to claim."
}

gift {
  already-accepted = "<etag:'ERROR'> <body>That gift was accepted. It cannot be taken back."
  take-back-title  = "Take the gift back?"
  taken-back       = "<tag:'BLYSIS'> <body>You took back <value><thing><body>. <value><amount><body> credits came back to you."
}

state {
  gift-waiting = "waiting to be accepted"
  ready        = "ready to claim"
  accepted     = "accepted"
  on           = "on"
  off          = "off"
}

# What the site's events say in game, from the lists in config.conf. <player> is the member,
# or the word for someone when the site keeps them anonymous.
announce {
  purchase      = "<tag:'BLYSIS'> <value><player><body> bought <value><quantity>x <product><body> on the site."
  topup         = "<tag:'BLYSIS'> <value><player><body> topped up <value><amount><body> credits on the site."
  goal-title    = "<good>Goal reached"
  goal-subtitle = "<body><event-title>: <value><raised><body> of <value><goal>"
  someone       = "Someone"
  gift-received = "<tag:'BLYSIS'> <value><from><body> sent you <value><quantity>x <product><body>. It waits in your chest until you accept it."
}
staff {
  site-down = "<etag:'ERROR'> <body>The site does not answer. Deliveries wait there and purchases are refused until it is back."
  site-back = "<tag:'BLYSIS'> <body>The site answers again."
}
