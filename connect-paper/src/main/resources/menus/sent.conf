# The gifts a player sent. One nobody accepted yet can be taken back, which refunds it in full.
#
# The header of menus/store.conf explains the grammar. The actions this window knows:
#   blysis:take-back    asks yes or no, then takes the clicked gift back
#   blysis:open-chest   back to the chest
#
# The facts a tile may name: count, to, gift-state.

title = "@menu.sent.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {

  gifts {
    slots = ["10-16", "19-25", "28-34"]
    priority = 5
    list {
      source = "blysis:sent"
      template {
        material = "%chest_icon%"
        name = " "
        # The closing sentence follows the gift: one still waiting can be taken back, an accepted one cannot.
        lore = ["tile:5 @menu.sent.gift count to gift-state action:@menu.sent.gift.actions.%sent_state%"]
        click { left = ["blysis:take-back", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
      }
    }
  }

  bar {
    slots = ["45-53"]
    priority = 1
    material = GRAY_STAINED_GLASS_PANE
    name = " "
  }

  back {
    slot = 45
    priority = 10
    material = FEATHER
    name = "@menu.button.back"
    click { left = ["blysis:open-chest", "sound:UI_BUTTON_CLICK 0.5 1.6"] }
  }

  previous {
    slot = 52
    priority = 10
    type = previous
    material = ARROW
    name = "@menu.button.previous"
  }

  next {
    slot = 53
    priority = 10
    type = next
    material = ARROW
    name = "@menu.button.next"
  }
}
